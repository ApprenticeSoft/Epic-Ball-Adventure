apply plugin: "application"
apply plugin: "java"

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets.main.java.srcDirs = ["src/"]

project.ext.mainClassName = "com.one.button.jam.desktop.DesktopLauncher"
project.ext.assetsDir = new File("../android/assets")

application {
    mainClass = project.mainClassName
}

dependencies {
    implementation project(":core")

    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}

tasks.named("run", JavaExec).configure {
    workingDir = project.assetsDir
    standardInput = System.in
    ignoreExitValue = true
    ["ball.screenshot", "ball.screenshot.frame"].each { propertyName ->
        if (System.getProperty(propertyName) != null) {
            systemProperty propertyName, System.getProperty(propertyName)
        }
    }
}

tasks.register("fatJar", Jar) {
    group = "build"
    archiveBaseName.set("epic-ball-adventure-desktop")
    archiveVersion.set("1.0.0")
    dependsOn(":core:jar", "classes")

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes("Main-Class": project.mainClassName)
    }

    from sourceSets.main.output
    from(project.assetsDir) {
        into("")
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
